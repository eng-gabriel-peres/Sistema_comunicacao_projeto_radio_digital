# Configuração do RTL-SDR do projeto (requisito CAL-01).
# Lida pelo receptor a partir do Bloco 2. Registro completo: docs/calibracao_rtl.md

[calibracao]
correcao_ppm = 87  # par "Pluto da equipe + RTL 2 de 25/11" (o limpo), medido em 25/11/2026, RTL frio
data = "2026-11-25"
pluto = "Pluto da equipe (Rev.C AD9364, fw v0.32, serial ...bc7b7b4d52)"
medicoes_do_par_ppm = [84.04, 84.21]  # 10:06 e 10:09, RTL aquecido
residuo_medido_com_84_hz = [-356, -524]  # o receptor precisa estimar o resíduo
erro_absoluto_rtl_ppm = -74.6  # mediana nas emissoras FM, aquecido (dados/calibracao/fm_20261104_101037.json)

# Histórico: com o Pluto do professor (22/10/2026) a correção adotada foi de 77 ppm.
# Cada Pluto tem o seu próprio erro de oscilador; ao trocar de Pluto, recalibrar.
# 25/11/2026: par −55,6 ppm (calibracao_20261125_095447.json), RTL absoluto −47,5 ppm pelas FM
# (fm_20261125_095526.json). Em 04/11 o RTL era −75 ppm e o par −84: o Pluto é o mesmo (cerca de
# −8 ppm nas duas datas) e o RTL é outro, ou mudou. Os campos medicoes_do_par_ppm e
# residuo_medido_com_84_hz acima são de 04/11.
# 25/11/2026, 11:06: trocado o RTL (o primeiro tinha o oscilador modulado em 1,7 kHz, raias a −8 dBc).
# O RTL 2 tem raias a −62 dBc e par −87,4 ppm (calibracao_20261125_110659.json), perto dos −84 de 04/11.
