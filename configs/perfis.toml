# Perfis de enlace (sdrlink.config.Perfil). O TX, a gravação e o RX usam o mesmo perfil:
#   python scripts/transmitir.py payloads.bin --perfil prova-a
#   python scripts/gravar_iq.py --perfil prova-a --segundos 62
#   python scripts/receber.py <captura>.npy --perfil prova-a
# Um parâmetro dado na linha de comando substitui só aquele campo, e o registro
# JSON de cada script guarda o perfil completo que foi usado.
#
# Campos: modulacao, pulso, sps (amostras por símbolo), beta (RRC), bt (gaussiano),
# h (2-FSK), taxa_sps, deslocamento_hz (sinal em relação ao LO), lo_hz, fec,
# emendar_caudas (TX com as caudas do RRC somadas entre quadros), limiar (detecção
# do RX, padrão 0,5), descricao.
# Taxa de bits = taxa_sps / sps (o dobro na DQPSK).

[prova-a]
descricao = "Prova A: DQPSK RRC a 1365 kbit/s, banda a 99% de 0,75 MHz, margem de 5 dB na bancada (docs/etapa6_dqpsk.md)"
modulacao = "dqpsk"
pulso = "rrc"
sps = 3  # amostras por símbolo; 2 bits por símbolo no corpo do quadro
beta = 0.25
taxa_sps = 2.048e6
deslocamento_hz = 425e3  # sinal de +50 a +800 kHz: longe do DC e dentro da faixa plana do RTL
lo_hz = 919.5e6
emendar_caudas = true  # +2,1% de goodput (docs/etapa6_emenda.md)

[prova-a-8psk]
descricao = "Experimental: 8-PSK coerente RRC a 2048 kbit/s, a mesma banda de 0,75 MHz, +48% de goodput; pede 2,8 dB a mais de C/N0 (docs/etapa6_8psk.md)"
modulacao = "8psk"
pulso = "rrc"
sps = 3  # amostras por símbolo; 3 bits por símbolo no corpo do quadro
beta = 0.25
taxa_sps = 2.048e6
deslocamento_hz = 425e3
lo_hz = 919.5e6
emendar_caudas = true

[prova-a-24]
descricao = "Experimental: DQPSK a 2,4 MS/s, 1,6 Mbit/s no ar, banda de 850 kHz; só se o RTL gravar 2,4 MS/s sem perda (docs/etapa6_taxa_24.md)"
modulacao = "dqpsk"
pulso = "rrc"
sps = 3
beta = 0.2  # 850 kHz de banda: 15% de folga sobre 1 MHz (com 0,25 seriam 875 kHz)
taxa_sps = 2.4e6
deslocamento_hz = 475e3  # sinal de +50 a +900 kHz do LO
lo_hz = 919.5e6
emendar_caudas = true  # +2,1% de goodput (docs/etapa6_emenda.md)

[prova-a-fec]
descricao = "Reserva 1 da prova A: DQPSK com FEC, goodput da DBPSK com 3,3 dB a mais de margem (docs/etapa6_viterbi_lote.md)"
modulacao = "dqpsk"
pulso = "rrc"
sps = 3
beta = 0.25
taxa_sps = 2.048e6
deslocamento_hz = 425e3
lo_hz = 919.5e6
fec = true
emendar_caudas = true  # +1,1% de goodput (docs/etapa6_emenda.md)

[prova-a-dbpsk]
descricao = "Reserva 2 da prova A: DBPSK RRC a 682,7 kbit/s, sem FEC (docs/etapa6_prova_a.md)"
modulacao = "dbpsk"
pulso = "rrc"
sps = 3
beta = 0.25
taxa_sps = 2.048e6
deslocamento_hz = 425e3  # sinal de +50 a +800 kHz: longe do DC e dentro da faixa plana do RTL
lo_hz = 919.5e6
emendar_caudas = true  # +1,1% de goodput (docs/etapa6_emenda.md)

[prova-b]
descricao = "Prova B: DBPSK RRC com FEC a 25,6 kbit/s no ar, C/N0 de 48,4 dB-Hz (docs/etapa6_fec.md)"
modulacao = "dbpsk"
pulso = "rrc"
sps = 80  # goodput sem perdas de 11,84 kbit/s: 17,2% de folga sobre os 10 kbit/s com PER de 1%
beta = 0.35
deslocamento_hz = 250e3
lo_hz = 919.5e6
fec = true
limiar = 0.4  # com FEC a detecção é o gargalo: 0,4 dB a mais de alcance (docs/etapa6_limiar.md)

[prova-b-sem-fec]
descricao = "Prova B do bloco 08: DBPSK RRC a 12,8 kbit/s sem código, C/N0 de 51,3 dB-Hz"
modulacao = "dbpsk"
pulso = "rrc"
sps = 160
beta = 0.35
deslocamento_hz = 250e3
lo_hz = 919.5e6

[prova-b-limite]
descricao = "Prova B no limite: DBPSK RRC a 11,6 kbit/s, +0,4 dB, só 4,4% de folga no goodput"
modulacao = "dbpsk"
pulso = "rrc"
sps = 176
beta = 0.35
deslocamento_hz = 250e3
lo_hz = 919.5e6

[dbpsk-256k]
descricao = "Bancada da Etapa 5: DBPSK RRC a 256 kbit/s"
modulacao = "dbpsk"
pulso = "rrc"
sps = 8
beta = 0.35
deslocamento_hz = 250e3
lo_hz = 919.5e6

[gfsk-128k]
descricao = "Bancada da Etapa 5: GFSK BT 0,5 a 128 kbit/s"
modulacao = "fsk"
pulso = "gaussiano"
sps = 16
bt = 0.5
deslocamento_hz = 250e3
